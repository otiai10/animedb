# CircleCI 1.0の旧設定。現行サービスでの再開には設定形式の移行が必要。
machine:
  environment:
    USER_NAME: builtinnya
    USER_EMAIL: builtinnya@gmail.com
  python:
    version: 2.7.12
  ruby:
    version: 2.7.8
  timezone: Asia/Tokyo

dependencies:
  pre:
    - cd docs && bin/setup

database:
  override:
    - echo 'No database setup'

test:
  override:
    - ./animedb test
  post:
    - cd docs && bundle exec jekyll build
    # - cd docs && bundle exec htmlproofer ./_site --only-4xx --allow-hash-href=true

deployment:
  production:
    branch: master
    commands:
      - cd docs && bin/automated
